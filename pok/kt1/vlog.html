<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> KT1 vlog</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0e0e0, #ffffff); /* Gradient nền */
            font-family: 'Roboto', sans-serif; /* Sử dụng phông chữ Google Fonts */
            color: #333;
        }
        .header {
            background-color: #4CAF50;
            color: white;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        .button-container {
            margin-top: 10px;
        }
        .button-container a {
            text-decoration: none;
            padding: 10px 20px;
            background-color: #ffffff;
            color: #4CAF50;
            border-radius: 5px;
            margin: 0 5px;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .button-container a:hover {
            background-color: #45a049;
            color: white;
            transform: scale(1.1);
        }
        .container {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }
        .bill {
            background-color: white;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        .bill:hover {
            transform: scale(1.02);
        }
        .info, .total {
            margin-bottom: 15px;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        .table th, .table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            transition: background-color 0.3s ease;
        }
        .table th {
            background-color: #f9f9f9;
        }
        .table tr:hover td {
            background-color: #f1f1f1;
        }
        .total {
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>cân liên hợp WAINV</h1>
	 <div class="button-container">
        <a href="#">vlog</a>
		<a href="index.html">bill</a>
        <a href="kt1.html">KT1</a>
    </div>
</div>

<div class="container">
    <div class="content">
        <div class="header">
            <h1>Một số cái về dự án khoa học kĩ thuật </h1>
        </div>
        <p>Hello! I'm John Doe, a passionate web developer with a love for creating efficient and user-friendly websites. Feel free to reach out to me for any web development projects!</p>
    </div>
</div>

</body>
</html>
